# CI skeleton. A PR runs only the jobs for the classes it touches; a push to
# main runs everything and opens an issue when it fails. There are no path
# filters on the workflow itself: every update to a PR starts a run, so the
# merge queue never waits on a run that was skipped.
#
# Replace each "echo" step with the project's real command. Keep the job
# names: the merge queue reads nothing from them, but people do.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      classes: ${{ steps.classes.outputs.classes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classes
        shell: sh
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            case "$base" in 0000000000000000000000000000000000000000) base="${{ github.sha }}~1" ;; esac
          fi
          classes=$(sh scripts/ci/classify.sh "$base" "${{ github.sha }}")
          echo "classes=$classes" >> "$GITHUB_OUTPUT"
          echo "Classes: $classes"

  app:
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'app') || contains(needs.classify.outputs.classes, 'tests') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the tests for this class
        # When this gets slow, shard it: add "strategy: matrix: shard: [1, 2, 3, 4]"
        # to this job and pass the shard to the runner, for example
        # "pytest --splits 4 --group ${{ matrix.shard }}" or "vitest --shard=N/4".
        run: echo "replace with the build and the app tests"

  data:
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'data') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the data shape
        run: echo "replace with the seed and migration checks"

  docs:
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'docs') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the docs
        run: echo "replace with the link and spelling checks"

  spec-check:
    # A change to src/ belongs to a spec: the pull request names it in its
    # body ("Spec: specs/<feature>") or, when the design changed, changes
    # the feature's folder. Naming is the normal case; a touch requirement
    # alone made every pull request append to spec.md.
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'app') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail when src/ changed without naming or changing its spec
        env:
          SPEC_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: sh scripts/ci/spec-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  setup-check:
    # A change to a setup file must come with a line in SETUP.md.
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail when a setup file changed without SETUP.md
        run: sh scripts/ci/setup-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  shared-check:
    # A fix to shared code gets its own pull request. Passes when the list
    # of shared paths is empty.
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail when shared code is changed together with other work
        run: sh scripts/ci/shared-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  numbering-check:
    # Two numbered files with one number, or a task with a running number
    # instead of its issue number. Runs on every pull request, so a batch
    # that merged two migrations each called 0022 fails before main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on a reused number or a running task number
        run: sh scripts/ci/numbering-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  line-endings:
    # Runs on every PR and every push: mixed endings make every diff a conflict.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when a text file has CRLF endings
        run: sh scripts/ci/line-endings.sh

  status-page:
    # Runs on every PR and every push: the page must never go stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when STATUS.md is stale
        run: sh status/check.sh

  ci-passed:
    # The one check branch protection requires. It waits for whichever class
    # jobs ran and reports once. A class job that was skipped on purpose
    # counts as fine; one that failed or was cancelled does not. Never put the
    # per-class jobs in branch protection: they are skipped when a change does
    # not need them, and a required check that never reports blocks the merge.
    name: CI passed
    needs: [classify, app, data, docs, spec-check, setup-check, shared-check, numbering-check, line-endings, status-page]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Report once for every class check that ran
        shell: sh
        run: |
          failed=0
          for pair in "classify:${{ needs.classify.result }}" "app:${{ needs.app.result }}" "data:${{ needs.data.result }}" "docs:${{ needs.docs.result }}" "spec-check:${{ needs.spec-check.result }}" "setup-check:${{ needs.setup-check.result }}" "shared-check:${{ needs.shared-check.result }}" "numbering-check:${{ needs.numbering-check.result }}" "line-endings:${{ needs.line-endings.result }}" "status-page:${{ needs.status-page.result }}"; do
            job=${pair%%:*}
            result=${pair#*:}
            echo "$job: $result"
            case "$result" in failure|cancelled) failed=1 ;; esac
          done
          [ "$failed" -eq 0 ] || { echo "A class check failed; see the jobs above." >&2; exit 1; }
          echo "Every class check that ran is green."

  full:
    # The gate on main after every merge. The whole suite, nothing skipped.
    # With self-hosted runners, list them first and a hosted one last so a
    # job still runs when they are offline: runs-on: [self-hosted, linux] is
    # one label set; GitHub picks the first idle runner that matches, so use
    # a runner group with a hosted fallback rather than a label alone.
    # On a self-hosted Windows runner, copy the job-level default shell from
    # runner-check.yml (Git's bash by path), keep PowerShell steps on
    # "shell: pwsh", and never put an expression in "shell:". Run
    # scripts/ci/runner-doctor.sh on the machine first.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run everything
        run: echo "replace with the full suite"

  report-red:
    needs: full
    if: always() && github.event_name == 'push' && needs.full.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: sh
        run: |
          open=$(gh issue list --label ci-red --state open --json number -q length)
          if [ "$open" = "0" ]; then
            gh issue create \
              --title "main is red" \
              --label "ci-red,state:ready" \
              --body "The full run on main failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fix it before merging anything else."
          else
            echo "A ci-red issue is already open; not opening another."
          fi
